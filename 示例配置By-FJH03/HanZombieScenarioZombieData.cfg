// ZombieSystem 丧尸配置文件
// 每个丧尸一个子节点，可配置以下字段：
// name:             显示名称（用于HUD/提示/通用调用）
// model:            动画实体使用的模型路径
// friction:         摩擦力（决定移动速度，越小越快）
// attack_range:     与玩家距离多少时可发动攻击
// health:           血量
// damage:           单次攻击伤害
// hitboxsize:          受击框尺寸大小(用于定义能被攻击的部位大小 默认1.0)
// animesize:           动画尺寸大小(定义动画实体的视觉大小 默认1.0)
// idle_anim:        待机动画（多个用 , 分隔）
// move_anim:        移动动画（多个用 , 分隔）
// attack_anim:      攻击动画（多个用 , 分隔）
// getattack_anim:      守击动画（多个用 , 分隔）
// death_anim:       死亡动画（多个用 , 分隔）
// color:            显示颜色（RGBA 格式，例：255 255 255 255）

